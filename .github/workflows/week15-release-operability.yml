name: Week 15 MVP 3 operability
on:
  workflow_dispatch:
  push:
    branches: [docs/15-week-session2-mvp3]
    paths:
      - '.github/workflows/**'
      - '15-week/hu-status/**/*.java'
      - '15-week/hu-status/**/*.js'
      - '15-week/hu-status/**/pom.xml'
      - '15-week/hu-status/**/sources-lock.json'
      - '14-week/hu-status/**/*.mjs'
      - '13-week/hu-status/**/*.mjs'
      - '13-week/hu-status/**/reviewed-fixtures.json'
permissions:
  contents: read
env:
  WORKSHOP_SOURCES_LOCK: '15-week/hu-status/Sesión 2/sources-lock.json'
jobs:
  system:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '15-week/hu-status/Sesión 1/harness/pom.xml'
      - name: Export annotated v3.0.0 release commits
        run: node '14-week/hu-status/Sesión 2/prepare.mjs' "$RUNNER_TEMP/release-sources" all
      - name: Build the actual released application images
        run: node '15-week/hu-status/Sesión 1/bootstrap.mjs' "$RUNNER_TEMP/release-sources"
      - name: Exercise integration, money, load, chaos, rollback and simultaneous stress
        working-directory: '15-week/hu-status/Sesión 1/harness'
        run: mvn -B -ntp -Dtest=Mvp3ReleaseTest test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: week15-mvp3-system
          path: |
            15-week/hu-status/Sesión 1/harness/target/evidence/
            15-week/hu-status/Sesión 1/harness/target/surefire-reports/
  services:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        service: [security, commercial, identity-audit, operations-cost, cash-reporting, relay]
    runs-on: ${{ matrix.service == 'identity-audit' && 'ubuntu-22.04' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Export the released service and its domain-owned database
        env:
          COMPONENT: ${{ matrix.service }}
        run: node '14-week/hu-status/Sesión 2/prepare.mjs' "$RUNNER_TEMP/sources" "$COMPONENT"
      - name: Run native suites and existing coverage gates
        env:
          COMPONENT: ${{ matrix.service }}
        run: node '14-week/hu-status/Sesión 2/service.mjs' "$COMPONENT" "$RUNNER_TEMP/sources" "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: week15-mvp3-service-${{ matrix.service }}
          path: ${{ runner.temp }}/evidence/
  contracts:
    uses: ./.github/workflows/week13-security.yml
    with:
      contract_only: true
      sources_lock: '15-week/hu-status/Sesión 2/sources-lock.json'
  security:
    uses: ./.github/workflows/week13-threat-model-security.yml
    with:
      run_authorization: false
      sources_lock: '15-week/hu-status/Sesión 2/sources-lock.json'
  operability:
    if: always()
    needs: [system, services, contracts, security]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all operability checks
        env:
          SYSTEM: ${{ needs.system.result }}
          SERVICES: ${{ needs.services.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          for gate in SYSTEM SERVICES CONTRACTS SECURITY; do
            test "${!gate}" = success
          done
