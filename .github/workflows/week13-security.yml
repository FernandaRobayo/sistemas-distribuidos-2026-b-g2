name: Week 13 session 1 security integration

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - '13-week/hu-status/**/verify.*'
      - '13-week/hu-status/**/Session1LiveServerTest.java'
      - '13-week/hu-status/**/session1_e2e_test.go'
      - '13-week/hu-status/**/sources-lock.json'
      - '.github/workflows/week13-security.yml'
  push:
    branches: ['docs/13-week-session1-security']
    paths:
      - '13-week/hu-status/**/verify.*'
      - '13-week/hu-status/**/Session1LiveServerTest.java'
      - '13-week/hu-status/**/session1_e2e_test.go'
      - '13-week/hu-status/**/sources-lock.json'
      - '.github/workflows/week13-security.yml'

permissions:
  contents: read

jobs:
  verify-session1:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/go/pkg/mod
          key: ${{ runner.os }}-week13-${{ hashFiles('13-week/hu-status/**/sources-lock.json') }}
          restore-keys: ${{ runner.os }}-week13-
      - name: Obtain the exact product revisions used by this exercise
        env:
          WORKSHOP_PRODUCT_ROOT: ${{ runner.temp }}/MultiTour
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          const lock=JSON.parse(fs.readFileSync('13-week/hu-status/Sesión 1/sources-lock.json','utf8'));
          for(const {repository,revision} of Object.values(lock)) {
            const dest=path.join(process.env.WORKSHOP_PRODUCT_ROOT,repository);
            fs.mkdirSync(dest,{recursive:true});
            for(const args of [['init',dest],['-C',dest,'remote','add','origin',`https://github.com/code-corhuila/${path.basename(repository)}.git`],
              ['-C',dest,'fetch','--depth=1','origin',revision],['-C',dest,'checkout','--detach','FETCH_HEAD']]) {
              execFileSync('git',args,{stdio:'inherit'});
            }
          }
          JS
      - name: Run real authentication, service authorization and rotation checks
        env:
          WORKSHOP_PRODUCT_ROOT: ${{ runner.temp }}/MultiTour
        run: node '13-week/hu-status/Sesión 1/verify.mjs'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: week13-session1-evidence
          path: '13-week/hu-status/Sesión 1/evidence/'
