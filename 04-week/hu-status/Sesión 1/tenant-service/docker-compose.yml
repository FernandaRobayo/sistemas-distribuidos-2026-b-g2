services:
  postgres:
    image: postgres:16-alpine
    container_name: tenant-service-postgres
    environment:
      POSTGRES_DB: tenant_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - tenant-service-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tenant_service"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tenant-service-postgres-data:
