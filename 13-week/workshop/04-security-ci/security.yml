name: security

# Proposal for the pipeline of multi-tour-commercial-reservation-api (Java 21, Spring Boot 3.5, Maven).
on:
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Dependency audit
        run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  authz-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Authorization tests
        run: mvn -B test -Dtest=CatalogRolesAuthzTest
        env:
          BASE_URL: ${{ vars.COMMERCIAL_RESERVATION_URL }}
          COLLABORATOR_TOKEN: ${{ secrets.COLLABORATOR_TOKEN }}
