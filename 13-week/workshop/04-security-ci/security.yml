name: security

# Proposal for the pipeline of multi-tour-commercial-reservation-api (Java 21, Spring Boot 3.5, Maven).
on:
  pull_request:
    branches: [develop, qa, main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Dependency audit
        run: mvn -B org.owasp:dependency-check-maven:12.1.0:check -DfailBuildOnCVSS=7 -DnvdApiKey="$NVD_API_KEY"
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  authz-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ vars.COMMERCIAL_RESERVATION_URL }}
      COLLABORATOR_TOKEN: ${{ secrets.COLLABORATOR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Require a running integration target
        shell: bash
        run: |
          test -n "$BASE_URL" || { echo "COMMERCIAL_RESERVATION_URL is required"; exit 1; }
          test -n "$COLLABORATOR_TOKEN" || { echo "COLLABORATOR_TOKEN is required"; exit 1; }
      - name: Authorization tests against the service
        run: mvn -B verify -Dtest=CatalogRolesAuthzTest -DfailIfNoTests=true
