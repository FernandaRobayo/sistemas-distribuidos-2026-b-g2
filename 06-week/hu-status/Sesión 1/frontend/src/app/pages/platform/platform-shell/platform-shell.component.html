<main class="platform-shell">
  <aside class="platform-sidebar">
    <a class="platform-brand" routerLink="/platform">MULTI<span>TOUR</span></a>
    <p class="platform-role">Administrador de plataforma</p>
    <nav class="platform-nav" aria-label="Navegacion de plataforma">
      <div class="operator-nav-group">
        <a routerLink="/platform" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }"><svg class="operator-nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="2" y="2" width="6" height="6" rx="1.4"/><rect x="10" y="2" width="6" height="6" rx="1.4"/><rect x="2" y="10" width="6" height="6" rx="1.4"/><rect x="10" y="10" width="6" height="6" rx="1.4"/></svg>Resumen</a>
      </div>
      <div class="operator-nav-group">
        <span class="operator-nav-group-label">Gestión</span>
        <a routerLink="/platform/operators" routerLinkActive="is-active"><svg class="operator-nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="6.5" cy="6" r="2.2"/><path d="M2.5 15c0-2.5 1.8-4 4-4s4 1.5 4 4"/><circle cx="13" cy="7" r="1.8"/><path d="M10.8 15c.2-2 1.6-3.2 3.2-3.2"/></svg>Operadores</a>
        <a routerLink="/platform/audit" routerLinkActive="is-active"><svg class="operator-nav-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="2" y="3.5" width="14" height="12" rx="1.6"/><line x1="2" y1="7" x2="16" y2="7"/><line x1="6" y1="2" x2="6" y2="5"/><line x1="12" y1="2" x2="12" y2="5"/></svg>Auditoría</a>
      </div>
    </nav>
    <a class="platform-signout" routerLink="/login" (click)="logout()">Cerrar sesión</a>
  </aside>

  <div class="operator-main">
    <header class="operator-toolbar">
      <span class="operator-toolbar-tag">Panel de plataforma</span>
      <span class="operator-toolbar-role">Administrador de plataforma</span>
    </header>
    <section class="platform-content">
      <router-outlet></router-outlet>
    </section>
  </div>
</main>
