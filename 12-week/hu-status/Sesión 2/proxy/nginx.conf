events {}
http {
    upstream app { include /etc/nginx/active/upstream.conf; }
    server {
        listen 8080;
        location = /proxy-health { default_type text/plain; return 200 'ok\n'; }
        # Metadatos públicos del laboratorio; Angular no consume este endpoint.
        location = /deployment-config.json {
            default_type application/json;
            alias /etc/nginx/active/config.json;
        }
        location /gateway/ { proxy_pass http://gateway:8080/; }
        location / {
            include /etc/nginx/active/release.conf;
            proxy_pass http://app;
            proxy_connect_timeout 1s;
        }
    }
}
