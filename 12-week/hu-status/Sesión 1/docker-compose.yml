# Sistema real de Multi Tour: front (blue/green) + API Gateway, detrás de un balanceador.
# Las imágenes se re-etiquetan (docker tag) desde las ya construidas por los repos del producto: no se recompilan.
name: mt-release-lab
services:
  blue:
    image: multitour/front:${BLUE_TAG:-v1.0.0}
    environment: { APP_ENV: produccion-local }
    healthcheck: &hc
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 2s
      retries: 5
  green:
    image: multitour/front:${GREEN_TAG:-v2.0.0}
    environment: { APP_ENV: produccion-local }
    healthcheck: *hc
  gateway:
    image: multitour/api-gateway:${GATEWAY_TAG:-v2.0.0}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 5
  proxy:
    image: nginx:1.27-alpine
    ports: ["8090:8080"]
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/active:/etc/nginx/active:ro
    depends_on:
      blue: { condition: service_healthy }
      green: { condition: service_healthy }
      gateway: { condition: service_healthy }
