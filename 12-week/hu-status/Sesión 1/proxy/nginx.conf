events {}
http {
    upstream app {
        include /etc/nginx/active/upstream.conf;   # apunta a blue o green
    }
    server {
        listen 8080;
        location = /proxy-health { default_type text/plain; return 200 "proxy-ok\n"; }
        # API Gateway real del producto (una sola instancia, versión fija)
        location /gateway/ {
            proxy_pass http://gateway:8080/;
        }
        # Front real: blue o green según active/upstream.conf
        location / {
            include /etc/nginx/active/release.conf;   # X-Release: versión que atiende
            proxy_pass http://app;
            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
