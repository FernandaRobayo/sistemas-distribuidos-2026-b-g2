rule_files:
  - 06-alerts.yml
evaluation_interval: 1m
tests:
  - name: fast burn
    interval: 1m
    input_series:
      - series: 'http_requests_total{job="api-gateway",route="/api/v1/catalog/services",status="200"}'
        values: '0+80x480'
      - series: 'http_requests_total{job="api-gateway",route="/api/v1/catalog/services",status="503"}'
        values: '0+20x480'
    alert_rule_test:
      - eval_time: 8h
        alertname: CatalogAvailabilityFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              team: ErrorCapa8
            exp_annotations:
              summary: "Catalog routes return 5xx in more than 14.4 % of requests (fast burn)"
              runbook_url: "https://github.com/FernandaRobayo/sistemas-distribuidos-2026-b-g2/blob/main/11-week/workshop/07-runbook.md"
      - eval_time: 8h
        alertname: CatalogAvailabilitySlowBurn
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: ErrorCapa8
            exp_annotations:
              summary: "Catalog routes return 5xx in more than 6 % of requests (slow burn)"
              runbook_url: "https://github.com/FernandaRobayo/sistemas-distribuidos-2026-b-g2/blob/main/11-week/workshop/07-runbook.md"
  - name: slow burn only
    interval: 1m
    input_series:
      - series: 'http_requests_total{job="api-gateway",route="/api/v1/catalog/services",status="200"}'
        values: '0+90x480'
      - series: 'http_requests_total{job="api-gateway",route="/api/v1/catalog/services",status="503"}'
        values: '0+10x480'
    alert_rule_test:
      - eval_time: 8h
        alertname: CatalogAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 8h
        alertname: CatalogAvailabilitySlowBurn
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: ErrorCapa8
            exp_annotations:
              summary: "Catalog routes return 5xx in more than 6 % of requests (slow burn)"
              runbook_url: "https://github.com/FernandaRobayo/sistemas-distribuidos-2026-b-g2/blob/main/11-week/workshop/07-runbook.md"
  - name: healthy
    interval: 1m
    input_series:
      - series: 'http_requests_total{job="api-gateway",route="/api/v1/catalog/services",status="200"}'
        values: '0+100x480'
      - series: 'http_requests_total{job="api-gateway",route="/api/v1/catalog/services",status="503"}'
        values: '0+0x480'
    alert_rule_test:
      - eval_time: 8h
        alertname: CatalogAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 8h
        alertname: CatalogAvailabilitySlowBurn
        exp_alerts: []
  - name: low traffic
    interval: 1m
    input_series:
      - series: 'http_requests_total{job="api-gateway",route="/api/v1/catalog/services",status="200"}'
        values: '0+0.01x480'
      - series: 'http_requests_total{job="api-gateway",route="/api/v1/catalog/services",status="503"}'
        values: '0+0.01x480'
    alert_rule_test:
      - eval_time: 8h
        alertname: CatalogAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 8h
        alertname: CatalogAvailabilitySlowBurn
        exp_alerts: []
  - name: zero traffic
    interval: 1m
    input_series:
      - series: 'http_requests_total{job="api-gateway",route="/api/v1/catalog/services",status="200"}'
        values: '0+0x480'
      - series: 'http_requests_total{job="api-gateway",route="/api/v1/catalog/services",status="503"}'
        values: '0+0x480'
    alert_rule_test:
      - eval_time: 8h
        alertname: CatalogAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 8h
        alertname: CatalogAvailabilitySlowBurn
        exp_alerts: []
