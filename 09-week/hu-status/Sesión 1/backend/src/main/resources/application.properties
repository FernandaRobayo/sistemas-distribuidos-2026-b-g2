spring.application.name=travesia-natural

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-minutes=480
app.platform-admin.password=${APP_PLATFORM_ADMIN_PASSWORD:}
app.demo-seed.enabled=${APP_DEMO_SEED_ENABLED:false}
app.feature.health-diagnostics=${APP_FEATURE_HEALTH_DIAGNOSTICS:false}
