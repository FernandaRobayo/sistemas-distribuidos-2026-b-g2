services:
  postgres:
    image: postgres:16-alpine
    container_name: mvp1-tenant-service-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - tenant-service-postgres-data:/var/lib/postgresql/data
    networks:
      - mvp1-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  tenant-service:
    build:
      context: ./tenant-service
      dockerfile: Dockerfile
    container_name: mvp1-tenant-service
    environment:
      PORT: ${TENANT_SERVICE_PORT}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "${TENANT_SERVICE_PORT}:${TENANT_SERVICE_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mvp1-network

networks:
  mvp1-network:
    driver: bridge

volumes:
  tenant-service-postgres-data:
