name: multitour-week07
services:
  rabbitmq:
    image: rabbitmq:4-management@sha256:612ebf172397edbd30a5908a4ea27abc43e01e815f0eb9a222811ae338195c55
    hostname: week07-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: week07
      RABBITMQ_DEFAULT_PASS: week07-local-demo
    ports:
      - "127.0.0.1:5677:5672"
      - "127.0.0.1:15677:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  rabbitmq-data:
